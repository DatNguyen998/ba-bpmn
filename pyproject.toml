[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ba-bpmn-mcp"
version = "0.1.0"
description = "MCP server that draws checked BPMN diagrams (SVG, PNG, Camunda .bpmn) for business analysts"
license = {text = "MIT"}
authors = [{name = "Huy (Harvey) Tran"}]
requires-python = ">=3.10"
dependencies = ["mcp>=1.2,<2"]

[project.optional-dependencies]
test = ["pytest>=8", "pytest-cov>=5"]

[project.scripts]
bpmn-mcp = "bpmn_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/bpmn_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
