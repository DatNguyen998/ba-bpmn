# Weekly pull requests for newer versions of what this project depends on. Each one runs the same checks as any change.
version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    ignore:
      # The server needs mcp 1.x until server.py is migrated (docs/TRAPS.md, Trap 10).
      - dependency-name: "mcp"
        versions: [">=2"]

  - package-ecosystem: "npm"
    directory: "/docs/diagrams"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(ci)"
