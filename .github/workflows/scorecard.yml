name: Scorecard

# The OpenSSF Scorecard grades the repository's habits (pinned actions, limited token rights, dependency updates, code
# scanning, branch protection and more). The results go to the Security tab only. They are not published anywhere
# public, and no badge is shown, until the owner decides to turn publishing on (publish_results below).
on:
  branch_protection_rule:
  schedule:
    - cron: "41 4 * * 2"      # every Tuesday
  push:
    branches: [main]
  workflow_dispatch:

permissions: read-all

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
      security-events: write   # to show the results in the Security tab
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: false

      - uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: results.sarif
          category: scorecard
